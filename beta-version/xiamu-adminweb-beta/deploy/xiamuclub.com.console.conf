# 用途：配置夏目管理端、共享后端及静态资源的 Nginx 反向代理。
upstream miniprogram_backend {
  server 127.0.0.1:8080;
  keepalive 32;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _ xiamuclub.com www.xiamuclub.com;

  client_max_body_size 5m;

  location /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
  }

  location /static/ {
    alias /root/xiamu-server/static/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location / {
    return 301 https://xiamuclub.com$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  listen 8443 ssl http2;
  listen [::]:8443 ssl http2;
  server_name xiamuclub.com www.xiamuclub.com;

  ssl_certificate     /etc/nginx/ssl/xiamuclub.com_bundle.pem;
  ssl_certificate_key /etc/nginx/ssl/xiamuclub.com.key;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 5m;

  location /static/ {
    alias /root/xiamu-server/static/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location = /console {
    return 301 /console/;
  }

  location ^~ /console/assets/ {
    alias /usr/share/nginx/xiamuclub-backend-platform/console/assets/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location ^~ /console/ {
    root /usr/share/nginx/xiamuclub-backend-platform;
    try_files $uri $uri/ /console/index.html;
  }

  location ^~ /console/admin/ {
    rewrite ^/console(/admin/.*)$ $1 break;
    proxy_pass http://miniprogram_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location ^~ /console/api/ {
    rewrite ^/console(/api/.*)$ $1 break;
    proxy_pass http://miniprogram_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location ^~ /admin/ {
    proxy_pass http://miniprogram_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location ^~ /api/ {
    proxy_pass http://miniprogram_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location = / {
    return 301 /console/;
  }

  location / {
    proxy_pass http://miniprogram_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
